<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Abdullah Samir Zahran - AI and Data Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
    <clipPath id="circle"><circle cx="165" cy="130" r="95"/></clipPath>
  </defs>
  <rect width="1000" height="260" rx="14" fill="url(#bg)"/>
  <circle cx="165" cy="130" r="100" fill="none" stroke="#58a6ff" stroke-width="4"/>
  <image href="data:image/jpeg;base64," x="70" y="35" width="190" height="190" preserveAspectRatio="xMidYMid slice" clip-path="url(#circle)"/>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="300" y="115" font-size="46" font-weight="700" fill="#ffffff">Abdullah Samir Zahran</text>
    <text x="300" y="153" font-size="22" fill="#c9d1d9">AI &amp; Data Engineer</text>
  </g>
  <g font-family="'Courier New', Consolas, monospace" font-size="18" fill="#79c0ff">
    <text x="300" y="195" opacity="1">Machine Learning  |  Generative AI
      <animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1" keyTimes="0;0.22;0.25;0.5;0.75;0.97;0.98;0.99;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="300" y="195" opacity="0">RAG &amp; Multi-Agent Systems
      <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.25;0.28;0.47;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="300" y="195" opacity="0">ETL &amp; Big Data Pipelines
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.53;0.72;0.75;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="300" y="195" opacity="0">Azure  |  Databricks  |  PySpark
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.78;0.97;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
